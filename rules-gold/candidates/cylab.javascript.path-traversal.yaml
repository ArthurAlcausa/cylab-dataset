rules:
- id: cylab.javascript.path-traversal
  mode: taint
  message: 'Caminho construido com parametro da requisicao (CWE-22) [gold: taint]'
  severity: ERROR
  languages:
  - javascript
  metadata:
    cwe: CWE-22
    source: sintetico-cylab
    gold: taint-v1
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern-inside: function $F(..., $P, ...) {...}
      - pattern-inside: ($P) => {...}
      - pattern-inside: ($P) => $E
      - pattern-inside: (..., $P, ...) => {...}
      - pattern-inside: (..., $P, ...) => $E
      - pattern-inside: $M(..., $P, ...) {...}
      - pattern-inside: function $F(..., {..., $P, ...}, ...) {...}
      - pattern-inside: ({..., $P, ...}) => {...}
      - pattern-inside: ({..., $P, ...}) => $E
    - pattern: $P
    - metavariable-regex:
        metavariable: $P
        regex: ^(?!(res|resp|response|next|cb|callback|db|pool|conn|ds|knex|client)$)
