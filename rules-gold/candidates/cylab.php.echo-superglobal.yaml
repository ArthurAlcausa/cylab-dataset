rules:
- id: cylab.php.echo-superglobal
  mode: taint
  message: 'O parâmetro @C@ da requisição é ecoado no HTML sem escape, gerando XSS
    refletido (CWE-79) [gold: taint]'
  severity: ERROR
  languages:
  - php
  metadata:
    cwe: CWE-79
    source: sintetico-cylab
    gold: taint-v1
  pattern-sources:
  - pattern: $_GET
  - pattern: $_POST
  - pattern: $_REQUEST
  - pattern: $_COOKIE
  - pattern: $_SERVER
  - pattern: $_FILES
  - pattern: file_get_contents('php://input')
  - patterns:
    - pattern-inside: function $F(..., $P, ...) {...}
    - pattern: $P
    - metavariable-regex:
        metavariable: $P
        regex: ^\$(?!(db|conn|pdo|mysqli)$)
  pattern-sinks:
  - patterns:
    - pattern: echo $X;
    - focus-metavariable: $X
    - pattern-not-inside: 'if (<... preg_match(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... preg_match(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... in_array(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... in_array(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... str_starts_with(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... str_starts_with(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... strpos(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... strpos(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... ctype_digit(...) ...>) $STMT;

        ...'
