rules:
- id: cylab.sql.hardcoded-db-password
  message: 'O script de provisionamento de @T@ cria o usuário de banco com senha fixa
    no código, que vaza pelo versionamento (CWE-798) [gold: regex-tightened; opengrep
    sem taint p/ SQL]'
  severity: ERROR
  languages:
  - generic
  metadata:
    cwe: CWE-798
    source: sintetico-cylab
    author: bill-csharp-sql
    gold: regex-tightened-v1
  patterns:
  - pattern-regex: (?i)(IDENTIFIED\s+BY|PASSWORD\s*=|(WITH|LOGIN)\s+(ENCRYPTED\s+)?PASSWORD)\s*'[^']+'
  - pattern-not-regex: (?m)^\s*--.*$
