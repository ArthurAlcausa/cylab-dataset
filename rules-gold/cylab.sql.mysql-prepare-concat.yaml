rules:
- id: cylab.sql.mysql-prepare-concat
  message: 'A procedure MySQL monta a query de @T@ com CONCAT do parâmetro e a executa
    via PREPARE, permitindo injeção (CWE-89) [gold: regex-tightened; opengrep sem
    taint p/ SQL]'
  severity: ERROR
  languages:
  - generic
  metadata:
    cwe: CWE-89
    source: sintetico-cylab
    author: bill-csharp-sql
    gold: regex-tightened-v1
  patterns:
  - pattern-regex: (?i)CONCAT\(\s*'[^']*\b(WHERE|SET|VALUES|ORDER BY|FROM)\b(?:[^']|'')*'\s*,\s*(?!QUOTE\()[A-Za-z_@]
  - pattern-not-regex: (?m)^\s*--.*$
