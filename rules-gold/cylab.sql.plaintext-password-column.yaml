rules:
- id: cylab.sql.plaintext-password-column
  message: 'A tabela de @T@ guarda a senha em coluna de texto, induzindo armazenamento
    em claro (CWE-256) [gold: regex-tightened; opengrep sem taint p/ SQL]'
  severity: ERROR
  languages:
  - generic
  metadata:
    cwe: CWE-256
    source: sintetico-cylab
    author: bill-csharp-sql
    gold: regex-tightened-v1
  patterns:
  - pattern-regex: (?i)\b(senha|password|pwd|passwd)\w*\s+(VARCHAR|NVARCHAR|TEXT|CHAR|VARCHAR2)\b
  - pattern-not-regex: (?m)^\s*--.*$
