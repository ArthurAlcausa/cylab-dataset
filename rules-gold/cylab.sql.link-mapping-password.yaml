rules:
- id: cylab.sql.link-mapping-password
  message: 'O database link / user mapping usado por @T@ grava a senha remota em claro
    no DDL versionado (CWE-798) [gold: regex-tightened; opengrep sem taint p/ SQL]'
  severity: ERROR
  languages:
  - generic
  metadata:
    cwe: CWE-798
    source: sintetico-cylab
    author: bill-csharp-sql
    gold: regex-tightened-v1
  patterns:
  - pattern-regex: (?i)CONNECT\s+TO\s+\w+\s+IDENTIFIED\s+BY|OPTIONS\s*\([^)]*\bpassword\s+'
  - pattern-not-regex: (?m)^\s*--.*$
