rules:
- id: cylab.cpp.memcpy-string-size-gold
  languages:
  - cpp
  severity: ERROR
  message: Copia-se o conteúdo de @C@ para um array fixo usando o tamanho da string
    de origem, sem limitar ao destino, causando est (CWE-120)
  metadata:
    cwe: CWE-120
    source: sintetico-cylab
    author: bill-scale
  pattern-either:
  - pattern: memcpy($D, $S, $X.size())
  - pattern: memcpy($D, $S, $X.length())
  - pattern: std::memcpy($D, $S, $X.size())
  - pattern: std::memcpy($D, $S, $X.length())
