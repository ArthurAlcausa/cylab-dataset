rules:
- id: cylab.python.tar-zip-extractall
  mode: taint
  message: 'O arquivo compactado de @T@ é extraído inteiro sem validar os nomes, e
    entradas com ../ ou caminho absoluto escrevem for (CWE-22) [gold: taint]'
  severity: ERROR
  languages:
  - python
  metadata:
    cwe: CWE-22
    source: sintetico-cylab
    gold: taint-v1
  pattern-sources:
  - patterns:
    - pattern-inside: "def $F(..., $P, ...):\n  ..."
    - pattern: $P
  - pattern: request.$A
  - pattern: request.$A[...]
  - pattern: request.$A.get(...)
  - pattern: request.$A(...)
  pattern-sinks:
  - patterns:
    - pattern: open($X, ...)
    - focus-metavariable: $X
    - pattern-not-inside: "if <... $V.startswith(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... os.path.commonpath(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.is_relative_to(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V not in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.fullmatch(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.match(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isdigit() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isalnum() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.hostname ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.netloc ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.scheme ...>:\n  ...\n..."
  - patterns:
    - pattern: send_file($X, ...)
    - focus-metavariable: $X
    - pattern-not-inside: "if <... $V.startswith(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... os.path.commonpath(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.is_relative_to(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V not in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.fullmatch(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.match(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isdigit() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isalnum() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.hostname ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.netloc ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.scheme ...>:\n  ...\n..."
  - patterns:
