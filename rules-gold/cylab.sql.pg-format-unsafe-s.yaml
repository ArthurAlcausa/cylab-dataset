rules:
- id: cylab.sql.pg-format-unsafe-s
  message: 'A função usa format() com %s para inserir valor/identificador de @T@ no
    SQL dinâmico, sem quoting, permitindo injeção (CWE-89) [gold: regex-tightened;
    opengrep sem taint p/ SQL]'
  severity: ERROR
  languages:
  - generic
  metadata:
    cwe: CWE-89
    source: sintetico-cylab
    author: bill-csharp-sql
    gold: regex-tightened-v1
  patterns:
  - pattern-regex: (?i)format\(\s*'(?:[^']|'')*%s
  - pattern-not-regex: (?m)^\s*--.*$
