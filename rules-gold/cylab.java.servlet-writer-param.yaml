rules:
- id: cylab.java.servlet-writer-param
  mode: taint
  message: 'O servlet de @S@ escreve o parâmetro da requisição direto na resposta
    HTML, gerando XSS refletido (CWE-79) [gold: taint]'
  severity: ERROR
  languages:
  - java
  metadata:
    cwe: CWE-79
    source: sintetico-cylab
    gold: taint-v1
  pattern-sources:
  - patterns:
    - pattern-inside: $RT $M(..., $T $P, ...) {...}
    - pattern: $P
    - metavariable-regex:
        metavariable: $T
        regex: ^(String|InputStream|byte\[\]|Object|String\[\]|HttpServletRequest)$
  - pattern: (HttpServletRequest $R).$F(...)
  - pattern: $R.getParameter(...)
  - pattern: $R.getHeader(...)
  pattern-sinks:
  - patterns:
    - pattern: $W.println($X)
    - focus-metavariable: $X
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.matches(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.matches(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.contains(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.contains(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $P.matcher(...).matches() ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $P.matcher(...).matches() ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.getHost() ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.getHost() ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.getScheme() ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.getScheme() ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $A.equals($B) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $A.equals($B) ...>) {...}

        ...'
  - patterns:
    - pattern: $W.print($X)
    - focus-metavariable: $X
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.matches(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.matches(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.contains(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.contains(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $P.matcher(...).matches() ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $P.matcher(...).matches() ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.getHost() ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.getHost() ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.getScheme() ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.getScheme() ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $A.equals($B) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $A.equals($B) ...>) {...}

        ...'
  - patterns:
    - pattern: $W.write($X)
    - focus-metavariable: $X
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.matches(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.matches(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.contains(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.contains(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $P.matcher(...).matches() ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $P.matcher(...).matches() ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.getHost() ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.getHost() ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.getScheme() ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.getScheme() ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $A.equals($B) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $A.equals($B) ...>) {...}

        ...'
  - patterns:
    - pattern: $W.append($X)
    - focus-metavariable: $X
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.matches(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.matches(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.contains(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.contains(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $P.matcher(...).matches() ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $P.matcher(...).matches() ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.getHost() ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.getHost() ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.getScheme() ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.getScheme() ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $A.equals($B) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $A.equals($B) ...>) {...}

        ...'
  pattern-sanitizers:
  - pattern: '$C ? $A : $D'
  - pattern: URLEncoder.encode(...)
  - pattern: Integer.parseInt(...)
  - pattern: Long.parseLong(...)
  - pattern: Integer.valueOf(...)
  - pattern: Long.valueOf(...)
  - pattern: StringEscapeUtils.escapeHtml4(...)
  - pattern: Encode.forHtml(...)
  - pattern: HtmlUtils.htmlEscape(...)
  - pattern: $P.getFileName()
  - pattern: FilenameUtils.getName(...)
  - pattern: UUID.fromString(...)
