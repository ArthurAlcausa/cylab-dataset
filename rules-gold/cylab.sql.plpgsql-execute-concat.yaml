rules:
- id: cylab.sql.plpgsql-execute-concat
  message: 'A função PL/pgSQL concatena o argumento @C@ ao texto do EXECUTE, permitindo
    injeção de SQL (CWE-89) [gold: regex-tightened; opengrep sem taint p/ SQL]'
  severity: ERROR
  languages:
  - generic
  metadata:
    cwe: CWE-89
    source: sintetico-cylab
    author: bill-csharp-sql
    gold: regex-tightened-v1
  patterns:
  - pattern-regex: (?i)EXECUTE\s+'(?:[^']|'')*'\s*\|\|\s*(?!quote_ident|quote_literal|quote_nullable)(?!')[A-Za-z_$]
  - pattern-not-regex: (?m)^\s*--.*$
