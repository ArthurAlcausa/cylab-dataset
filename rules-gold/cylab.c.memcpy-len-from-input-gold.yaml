rules:
- id: cylab.c.memcpy-len-from-input-gold
  languages:
  - c
  severity: ERROR
  message: O tamanho copiado para o buffer de @S@ vem do próprio pacote (campo len)
    sem validação contra o destino, permitindo escr (CWE-787)
  metadata:
    cwe: CWE-787
    source: sintetico-cylab
    author: bill-scale
  patterns:
  - pattern-either:
    - pattern: memcpy($D, $S, $R->$F)
    - pattern: memcpy($D, $S, $R.$F)
  - metavariable-regex:
      metavariable: $F
      regex: ^(len|tamanho|size)$
