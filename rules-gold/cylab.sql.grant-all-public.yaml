rules:
- id: cylab.sql.grant-all-public
  message: 'Conceder ALL sobre @T@ a PUBLIC (ou a qualquer host) dá a todos os usuários
    poder de alterar/apagar dados, violando meno (CWE-269) [gold: regex-tightened;
    opengrep sem taint p/ SQL]'
  severity: ERROR
  languages:
  - generic
  metadata:
    cwe: CWE-269
    source: sintetico-cylab
    author: bill-csharp-sql
    gold: regex-tightened-v1
  patterns:
  - pattern-regex: (?i)GRANT\s+ALL(\s+PRIVILEGES)?\b[^;]*\bTO\s+(PUBLIC|'?\w+'?@'%')
  - pattern-not-regex: (?m)^\s*--.*$
