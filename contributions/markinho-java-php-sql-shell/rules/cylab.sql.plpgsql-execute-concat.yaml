rules:
  - id: cylab.sql.plpgsql-execute-concat
    message: "A função PL/pgSQL concatena o argumento @C@ ao texto do EXECUTE, permitindo injeção de SQL (CWE-89)"
    severity: ERROR
    languages: [generic]
    metadata:
      cwe: "CWE-89"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(?i)EXECUTE\s+''(?:[^'']|'''')*''\s*\|\|'
