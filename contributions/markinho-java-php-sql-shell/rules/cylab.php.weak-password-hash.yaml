rules:
  - id: cylab.php.weak-password-hash
    message: "A senha do @S@ é armazenada/comparada com md5/sha1, hash rápido e sem salt, quebrável por tabelas e GPU (CWE-328)"
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-328"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '\b(md5|sha1)\(\s*\$(senha|password|pass|pwd|_POST)'
