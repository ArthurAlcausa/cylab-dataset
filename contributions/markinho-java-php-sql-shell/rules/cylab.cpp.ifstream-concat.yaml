rules:
  - id: cylab.cpp.ifstream-concat
    message: "O arquivo de @S@ é aberto concatenando a base com nome externo, o que permite ../ e leitura fora do diretório (CWE-22)"
    severity: ERROR
    languages: [cpp]
    metadata:
      cwe: "CWE-22"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'std::ifstream\s+\w+\s*\(\s*\w+\s*\+'
