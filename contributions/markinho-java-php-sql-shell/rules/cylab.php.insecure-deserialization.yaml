rules:
  - id: cylab.php.insecure-deserialization
    message: "unserialize de entrada do usuario (CWE-502)"
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-502"
      source: sintetico-cylab
    pattern-either:
      - pattern: unserialize($_COOKIE[$K])
      - pattern: unserialize($_POST[$K])
