rules:
  - id: cylab.csharp.xml-dtd-parse
    message: "O XML de @T@ é lido com DTD habilitado ou resolver de URL, permitindo XXE para ler arquivos ou fazer SSRF (CWE-611)"
    severity: ERROR
    languages: [csharp]
    metadata:
      cwe: "CWE-611"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'DtdProcessing\s*=\s*DtdProcessing\.Parse|XmlResolver\s*=\s*new\s+XmlUrlResolver'
