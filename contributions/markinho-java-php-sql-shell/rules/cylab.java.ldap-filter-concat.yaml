rules:
  - id: cylab.java.ldap-filter-concat
    message: "O filtro LDAP para localizar o @S@ concatena o valor do usuário, permitindo injetar *, ) ou | e alterar a busca (CWE-90)"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-90"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '"\(&?\(?\w*\(?(uid|cn|mail|sAMAccountName)=["'']?\s*\+|\((uid|cn|mail)="\s*\+'
