rules:
  - id: cylab.java.sql-injection
    message: "Statement com SQL concatenado (CWE-89)"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-89"
      source: sintetico-cylab
    pattern-either:
      - pattern: (java.sql.Statement $S).executeQuery("..." + $X + ...)
      - pattern: $S.executeQuery("..." + $X + "...")
      - pattern: $S.executeQuery("..." + $X)
