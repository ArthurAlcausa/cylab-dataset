rules:
  - id: cylab.java.messagedigest-weak
    message: "A senha/token de @S@ é protegida com MD5 ou SHA-1, algoritmos rápidos e com colisões conhecidas (CWE-328)"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-328"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'MessageDigest\.getInstance\(\s*"(MD5|SHA-?1|MD2)"\s*\)'
