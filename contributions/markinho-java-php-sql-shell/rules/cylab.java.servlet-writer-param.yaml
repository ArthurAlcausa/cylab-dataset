rules:
  - id: cylab.java.servlet-writer-param
    message: "O servlet de @S@ escreve o parâmetro da requisição direto na resposta HTML, gerando XSS refletido (CWE-79)"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-79"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '\.(print|println|write|append)\([^;]*request\.getParameter'
