rules:
  - id: cylab.java.url-from-parameter
    message: "O backend busca a URL passada pelo cliente para gerar a prévia/webhook de @S@, permitindo SSRF contra serviços internos (CWE-918)"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-918"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'new\s+URL\(\s*request\.getParameter|URI\.create\(\s*request\.getParameter'
