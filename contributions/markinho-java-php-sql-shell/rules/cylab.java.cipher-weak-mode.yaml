rules:
  - id: cylab.java.cipher-weak-mode
    message: "Os dados de @S@ são cifrados com algoritmo fraco ou AES em ECB (o padrão de AES), que vaza padrões e não autentica (CWE-327)"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-327"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'Cipher\.getInstance\(\s*"(DES|DESede|RC4|Blowfish|AES|AES/ECB[^"]*|DES/[^"]*)"\s*\)'
