rules:
  - id: cylab.java.trust-all-certs
    message: "O cliente HTTPS de @T@ aceita qualquer certificado/hostname, anulando o TLS e permitindo MITM (CWE-295)"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-295"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'checkServerTrusted\([^)]*\)\s*(throws\s+[\w.]+\s*)?\{\s*\}|setHostnameVerifier\(\s*\([^)]*\)\s*->\s*true'
