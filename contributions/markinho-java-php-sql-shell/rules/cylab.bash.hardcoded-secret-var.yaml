rules:
  - id: cylab.bash.hardcoded-secret-var
    message: "A credencial do serviço de @T@ está escrita no script e fica exposta no repositório e em ps (CWE-798)"
    severity: ERROR
    languages: [bash]
    metadata:
      cwe: "CWE-798"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(?i)\b\w*(PASSWORD|PASSWD|SENHA|TOKEN|SECRET|API_KEY)\w*=["'']?[A-Za-z0-9_#!@%.\-]{6,}'
