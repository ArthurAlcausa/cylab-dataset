rules:
  - id: cylab.php.file-superglobal
    message: "O nome de arquivo de @S@ vem direto da requisição e é usado em leitura/inclusão de arquivo, permitindo path traversal ou (CWE-22)"
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-22"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(include|require|file_get_contents|readfile|fopen)(_once)?\s*\(?[^;]*\$_(GET|POST|REQUEST)'
