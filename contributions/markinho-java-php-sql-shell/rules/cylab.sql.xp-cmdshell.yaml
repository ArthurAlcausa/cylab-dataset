rules:
  - id: cylab.sql.xp-cmdshell
    message: "A rotina de @T@ habilita/usa xp_cmdshell, executando comandos do sistema operacional a partir do SQL e ampliando muito o (CWE-78)"
    severity: ERROR
    languages: [generic]
    metadata:
      cwe: "CWE-78"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(?i)''xp_cmdshell''\s*,\s*1|EXEC(UTE)?\s+(master\.\.|master\.dbo\.)?xp_cmdshell'
