rules:
  - id: cylab.csharp.connstring-password
    message: "A connection string do banco de @T@ contém senha literal no código (CWE-798)"
    severity: ERROR
    languages: [csharp]
    metadata:
      cwe: "CWE-798"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(?i)"[^"]*(Password|Pwd)\s*=\s*[^;"{]+'
