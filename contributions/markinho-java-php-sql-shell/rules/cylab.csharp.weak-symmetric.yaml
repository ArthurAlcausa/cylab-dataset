rules:
  - id: cylab.csharp.weak-symmetric
    message: "Os dados de @S@ são cifrados com DES/3DES/RC2 ou modo ECB, considerados inseguros (CWE-327)"
    severity: ERROR
    languages: [csharp]
    metadata:
      cwe: "CWE-327"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '\b(DES|TripleDES|RC2)\.Create\(|CipherMode\.ECB|new\s+(DES|TripleDES|RC2)CryptoServiceProvider'
