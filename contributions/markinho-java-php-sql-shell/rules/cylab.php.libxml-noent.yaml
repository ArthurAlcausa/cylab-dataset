rules:
  - id: cylab.php.libxml-noent
    message: "O XML de @T@ é carregado com LIBXML_NOENT/DTDLOAD, que substitui entidades externas e permite XXE (CWE-611)"
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-611"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'LIBXML_NOENT|LIBXML_DTDLOAD'
