rules:
  - id: cylab.cpp.printf-cstr
    message: "A mensagem de @S@ vinda de fora é usada como string de formato em printf, permitindo leitura/escrita de memória com %x/% (CWE-134)"
    severity: ERROR
    languages: [cpp]
    metadata:
      cwe: "CWE-134"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '\b(std::)?(printf\(\s*\w+(\.c_str\(\))?\s*\)|fprintf\(\s*\w+\s*,\s*\w+(\.c_str\(\))?\s*\))'
