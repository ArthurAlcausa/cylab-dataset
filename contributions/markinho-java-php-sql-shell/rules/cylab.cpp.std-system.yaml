rules:
  - id: cylab.cpp.std-system
    message: "A string de comando inclui @C@ externo e é executada por std::system, que passa pelo shell e permite injeção (CWE-78)"
    severity: ERROR
    languages: [cpp]
    metadata:
      cwe: "CWE-78"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '\b(std::)?(system|popen)\s*\('
