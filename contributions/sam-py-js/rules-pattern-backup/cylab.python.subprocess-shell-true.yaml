rules:
  - id: cylab.python.subprocess-shell-true
    message: "O comando é executado via shell com o valor @C@ concatenado, permitindo que metacaracteres como ; ou $( ) injetem comand (CWE-78)"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'shell\s*=\s*True'
