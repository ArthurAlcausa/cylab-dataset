rules:
  - id: cylab.typescript.sql-template-query
    message: "A consulta de @T@ interpola parâmetro do usuário no SQL, viabilizando injeção (CWE-89)"
    severity: ERROR
    languages: [typescript]
    metadata:
      cwe: "CWE-89"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '\.query\(\s*`[^`]*\$\{'
