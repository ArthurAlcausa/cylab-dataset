rules:
  - id: cylab.javascript.path-traversal
    message: "Caminho construido com parametro da requisicao (CWE-22)"
    severity: ERROR
    languages: [javascript]
    metadata:
      cwe: "CWE-22"
      source: sintetico-cylab
    pattern-either:
      - pattern: $FS.readFile(path.join($B, req.$P.$N), ...)
      - pattern: res.sendFile(path.join(..., req.$P.$N, ...), ...)
      - pattern: res.sendFile(path.join(..., req.$P.$N, ...))
