rules:
  - id: cylab.javascript.dom-sink-html
    message: "Valor de @C@ vindo da URL/dados é escrito no DOM como HTML (document.write/insertAdjacentHTML), executando scripts injet (CWE-79)"
    severity: ERROR
    languages: [javascript]
    metadata:
      cwe: "CWE-79"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'document\.write(ln)?\(|insertAdjacentHTML\(|\.outerHTML\s*='
