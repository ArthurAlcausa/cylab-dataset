rules:
  - id: cylab.typescript.readfile-template-path
    message: "O caminho do arquivo de @S@ é montado com template literal a partir do nome recebido, permitindo path traversal (CWE-22)"
    severity: ERROR
    languages: [typescript]
    metadata:
      cwe: "CWE-22"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(readFileSync|readFile|unlink|unlinkSync|writeFileSync)\(\s*`[^`]*\$\{'
