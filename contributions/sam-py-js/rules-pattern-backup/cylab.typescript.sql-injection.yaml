rules:
  - id: cylab.typescript.sql-injection
    message: "Query raw com interpolacao (CWE-89)"
    severity: ERROR
    languages: [typescript]
    metadata:
      cwe: "CWE-89"
      source: sintetico-cylab
    pattern-either:
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.query(`...${$X}...`)
      - pattern: $DB.$queryRawUnsafe(`...${$X}...`)
