rules:
  - id: cylab.javascript.exec-template
    message: "O comando de shell recebe @C@ interpolado, então caracteres como ; ou | permitem injeção de comandos (CWE-78)"
    severity: ERROR
    languages: [javascript]
    metadata:
      cwe: "CWE-78"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'exec(Sync)?\(\s*`[^`]*\$\{'
