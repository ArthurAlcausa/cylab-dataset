rules:
  - id: cylab.python.command-injection
    message: "Comando de shell com entrada externa (CWE-78)"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"
      source: sintetico-cylab
    pattern-either:
      - pattern: subprocess.$F(..., shell=True, ...)
      - pattern: os.system(...)
