rules:
  - id: cylab.javascript.sql-injection
    message: "SQL concatenado com entrada externa (CWE-89)"
    severity: ERROR
    languages: [javascript]
    metadata:
      cwe: "CWE-89"
      source: sintetico-cylab
    pattern-either:
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.query("..." + $X, ...)
      - pattern: $DB.query(`...${$X}...`)
      - pattern: $DB.query("..." + $X)
