rules:
  - id: cylab.javascript.express-file-param
    message: "O arquivo de @S@ é escolhido por parâmetro da requisição e unido ao diretório sem validação, permitindo ../ (CWE-22)"
    severity: ERROR
    languages: [javascript]
    metadata:
      cwe: "CWE-22"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(sendFile|createReadStream|readFile(Sync)?|download)\(\s*(path\.join\([^)]*)?req\.(params|query|body)'
