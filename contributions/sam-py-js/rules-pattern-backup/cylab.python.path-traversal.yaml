rules:
  - id: cylab.python.path-traversal
    message: "Caminho de arquivo construido com entrada externa sem validacao (CWE-22)"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-22"
      source: sintetico-cylab
    patterns:
      - pattern-either:
          - pattern: open(os.path.join($BASE, request.$A.get(...)), ...)
          - pattern: send_file(os.path.join($BASE, $X), ...)
      - pattern-not-inside: |
          if not $P.startswith(...):
              ...
          ...
