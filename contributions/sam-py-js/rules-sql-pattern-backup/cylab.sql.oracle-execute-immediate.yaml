rules:
  - id: cylab.sql.oracle-execute-immediate
    message: "O bloco PL/SQL de @T@ concatena o parâmetro ao EXECUTE IMMEDIATE, permitindo injeção de SQL (CWE-89)"
    severity: ERROR
    languages: [generic]
    metadata:
      cwe: "CWE-89"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(?i)EXECUTE\s+IMMEDIATE\s+''(?:[^'']|'''')*''\s*\|\|'
