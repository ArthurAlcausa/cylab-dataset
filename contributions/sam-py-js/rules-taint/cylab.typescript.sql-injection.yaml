rules:
- id: cylab.typescript.sql-injection
  mode: taint
  message: 'Query raw com interpolacao (CWE-89) [gold: taint]'
  severity: ERROR
  languages:
  - typescript
  metadata:
    cwe: CWE-89
    source: sintetico-cylab
    gold: taint-v1-sam
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: function $F(..., $P, ...) {...}
      - pattern: ($P) => {...}
      - pattern: ($P) => $E
      - pattern: (..., $P, ...) => {...}
      - pattern: (..., $P, ...) => $E
      - pattern: $M(..., $P, ...) {...}
      - pattern: function $F(..., {..., $P, ...}, ...) {...}
      - pattern: ({..., $P, ...}) => {...}
      - pattern: ({..., $P, ...}) => $E
      - pattern: 'function $F(..., {..., $P, ...}: $T, ...) {...}'
      - pattern: '({..., $P, ...}: $T) => {...}'
      - pattern: '({..., $P, ...}: $T) => $E'
    - focus-metavariable: $P
    - metavariable-regex:
        metavariable: $P
        regex: ^(?!(res|resp|response|next|cb|callback|db|pool|conn|ds|knex|client|s|sanitizer)$)
  - pattern: $REQ.query
  - pattern: $REQ.params
  - pattern: $REQ.body
  - pattern: $REQ.cookies
  - pattern: $REQ.headers
  - pattern: location.$A
  - pattern: window.location.$A
  - pattern: new URLSearchParams(...)
  - pattern: document.cookie
  - pattern: document.referrer
  pattern-sinks:
  - patterns:
    - pattern: $DB.query($X, ...)
    - focus-metavariable: $X
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.has(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.has(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.includes(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.includes(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $R.test(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $R.test(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.protocol ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.protocol ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.hostname ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.hostname ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.host ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.host ...>) {...}

        ...'
  - patterns:
    - pattern: $DB.execute($X, ...)
    - focus-metavariable: $X
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.has(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.has(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.includes(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.includes(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $R.test(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $R.test(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.protocol ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.protocol ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.hostname ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.hostname ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.host ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.host ...>) {...}

        ...'
  - patterns:
    - pattern: $DB.raw($X, ...)
    - focus-metavariable: $X
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.has(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.has(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.includes(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.includes(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $R.test(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $R.test(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.protocol ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.protocol ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.hostname ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.hostname ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.host ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.host ...>) {...}

        ...'
  - patterns:
    - pattern: $DB.whereRaw($X, ...)
    - focus-metavariable: $X
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.has(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.has(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.includes(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.includes(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $R.test(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $R.test(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.protocol ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.protocol ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.hostname ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.hostname ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.host ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.host ...>) {...}

        ...'
  - patterns:
    - pattern: $DB.$queryRawUnsafe($X, ...)
    - focus-metavariable: $X
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.has(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.has(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.includes(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.includes(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $R.test(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $R.test(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.protocol ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.protocol ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.hostname ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.hostname ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.host ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.host ...>) {...}

        ...'
  - patterns:
    - pattern: $DB.$executeRawUnsafe($X, ...)
    - focus-metavariable: $X
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.startsWith(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.has(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.has(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $S.includes(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $S.includes(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $R.test(...) ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $R.test(...) ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.protocol ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.protocol ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.hostname ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.hostname ...>) {...}

        ...'
    - pattern-not-inside: 'if (<... $V.host ...>) $STMT;

        ...'
    - pattern-not-inside: 'if (<... $V.host ...>) {...}

        ...'
  pattern-sanitizers:
  - pattern: '$C ? $A : $D'
  - pattern: '$S.has($X) ? $X : $D'
  - pattern: parseInt(...)
  - pattern: Number(...)
  - pattern: encodeURIComponent(...)
  - pattern: path.basename(...)
  - pattern: escapeHtml(...)
  - pattern: DOMPurify.sanitize(...)
  - pattern: sanitizeHtml(...)
  - pattern: String(Number(...))
  - pattern: escape(...)
  - patterns:
    - pattern: $O[$K]
    - metavariable-regex:
        metavariable: $O
        regex: ^[A-Z][A-Z0-9_]*$
  - pattern: '$S.has($X) ? $A : $B'
  - pattern: '$S.includes($X) ? $A : $B'
