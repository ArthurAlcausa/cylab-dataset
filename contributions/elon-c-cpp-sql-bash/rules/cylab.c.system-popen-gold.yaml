rules:
- id: cylab.c.system-popen-gold
  languages:
  - c
  severity: ERROR
  message: O comando é montado com @C@ externo e passado para system/popen, que invocam
    /bin/sh e permitem injeção de comandos (CWE-78)
  metadata:
    cwe: CWE-78
    source: sintetico-cylab
    author: bill-scale
  pattern-either:
  - pattern: system($C)
  - pattern: popen($C, $M)
