rules:
- id: cylab.c.world-writable-mode-gold
  languages:
  - c
  severity: ERROR
  message: O arquivo/diretório de @T@ é criado com permissão 0666/0777, gravável por
    qualquer usuário local (CWE-732)
  metadata:
    cwe: CWE-732
    source: sintetico-cylab
    author: bill-scale
  patterns:
  - pattern-either:
    - pattern: chmod($P, $M)
    - pattern: open($P, $FL, $M)
    - pattern: creat($P, $M)
    - pattern: mkdir($P, $M)
  - metavariable-regex:
      metavariable: $M
      regex: ^0?(777|666)$
