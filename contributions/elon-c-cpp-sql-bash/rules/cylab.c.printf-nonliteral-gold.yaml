rules:
- id: cylab.c.printf-nonliteral-gold
  languages:
  - c
  severity: ERROR
  message: O texto de @S@ controlado externamente é passado como string de formato;
    especificadores como %n ou %x permitem ler/escr (CWE-134)
  metadata:
    cwe: CWE-134
    source: sintetico-cylab
    author: bill-scale
  patterns:
  - pattern-either:
    - pattern: printf($X)
    - pattern: fprintf($F, $X)
    - pattern: syslog($P, $X)
  - pattern-not: printf("...")
  - pattern-not: fprintf($F, "...")
  - pattern-not: syslog($P, "...")
