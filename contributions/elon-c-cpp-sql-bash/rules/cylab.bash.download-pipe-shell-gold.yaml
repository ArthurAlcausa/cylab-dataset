rules:
- id: cylab.bash.download-pipe-shell-gold
  languages:
  - bash
  severity: ERROR
  message: O instalador de @T@ é baixado e executado direto no shell sem verificar
    integridade, então um servidor ou rede compromet (CWE-494)
  metadata:
    cwe: CWE-494
    source: sintetico-cylab
    author: bill-scale
  pattern-regex: (?m)^(?!\s*#)[^#\n]*?\b(curl|wget)\b[^|\n#]*\|\s*(sudo\s+)?(ba|z)?sh\b
