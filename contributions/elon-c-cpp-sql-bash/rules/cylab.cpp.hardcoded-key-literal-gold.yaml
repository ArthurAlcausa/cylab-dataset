rules:
- id: cylab.cpp.hardcoded-key-literal-gold
  languages:
  - cpp
  severity: ERROR
  message: Uma chave/senha do serviço de @T@ está embutida no binário como literal,
    recuperável com strings/engenharia reversa (CWE-798)
  metadata:
    cwe: CWE-798
    source: sintetico-cylab
    author: bill-scale
  pattern-regex: (?im)^\s*(static\s+)?(constexpr\s+)?(const\s+)?(std::string|char\s*\*|char|auto)\s+(const\s+)?\w*(key|chave|senha|password|token|secret)\w*(\[\])?\s*=\s*"[^"]{6,}"\s*;
