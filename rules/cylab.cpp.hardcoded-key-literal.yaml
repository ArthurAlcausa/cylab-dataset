rules:
  - id: cylab.cpp.hardcoded-key-literal
    message: "Uma chave/senha do serviço de @T@ está embutida no binário como literal, recuperável com strings/engenharia reversa (CWE-798)"
    severity: ERROR
    languages: [cpp]
    metadata:
      cwe: "CWE-798"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(?i)(std::string|char\s*\*|char|auto)\s+\w*(key|chave|senha|password|token|secret)\w*(\[\])?\s*=\s*"[^"]{6,}\"'
