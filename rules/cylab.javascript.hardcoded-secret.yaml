rules:
  - id: cylab.javascript.hardcoded-secret
    message: "Segredo literal no codigo (CWE-798)"
    severity: ERROR
    languages: [javascript]
    metadata:
      cwe: "CWE-798"
      source: sintetico-cylab
    patterns:
      - pattern-either:
          - pattern: const $K = "...";
          - pattern: jwt.sign($P, "...", ...)
      - metavariable-regex:
          metavariable: $K
          regex: (?i).*(secret|senha|password|token|key).*
