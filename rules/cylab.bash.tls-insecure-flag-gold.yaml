rules:
- id: cylab.bash.tls-insecure-flag-gold
  languages:
  - bash
  severity: ERROR
  message: O download/chamada de @T@ desliga a verificação TLS (-k / --no-check-certificate),
    permitindo MITM (CWE-295)
  metadata:
    cwe: CWE-295
    source: sintetico-cylab
    author: bill-scale
  pattern-regex: (?m)^(?!\s*#)[^#\n]*?(\bcurl\b[^\n#]*(\s-k\b|\s--insecure\b)|\bwget\b[^\n#]*--no-check-certificate)
