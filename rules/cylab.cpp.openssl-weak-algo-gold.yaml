rules:
- id: cylab.cpp.openssl-weak-algo-gold
  languages:
  - cpp
  severity: ERROR
  message: O código de @T@ usa primitiva fraca da OpenSSL (DES/RC4/AES-ECB/MD5/SHA-1)
    para proteger dados (CWE-327)
  metadata:
    cwe: CWE-327
    source: sintetico-cylab
    author: bill-scale
  patterns:
  - pattern-either:
    - pattern: $F()
    - pattern: MD5(...)
  - metavariable-regex:
      metavariable: $F
      regex: ^(EVP_(des_\w+|aes_\d+_ecb|rc4|md5|sha1)|MD5)$
