rules:
  - id: cylab.php.shell-concat
    message: "Comando de shell montado com dado externo (CWE-78)"
    severity: ERROR
    languages: [php]
    mode: taint
    metadata:
      cwe: "CWE-78"
      source: sintetico-cylab
      author: markinho-gold
    pattern-sources:
      - patterns:
          - pattern-inside: |
              function $F(..., $S, ...) { ... }
          - pattern: $S
      - pattern: $_GET[...]
      - pattern: $_POST[...]
    pattern-sinks:
      - pattern: system($CMD)
      - pattern: shell_exec($CMD)
      - pattern: exec($CMD)
      - pattern: passthru($CMD)
      - pattern: popen($CMD, ...)
    pattern-sanitizers:
      - pattern: escapeshellarg(...)
      - pattern: escapeshellcmd(...)
