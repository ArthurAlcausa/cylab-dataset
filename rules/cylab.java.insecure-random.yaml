rules:
  - id: cylab.java.insecure-random
    message: "O código/token de @S@ é gerado com java.util.Random ou Math.random, previsíveis a partir de poucas saídas (CWE-330)"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-330"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'new\s+Random\(|Math\.random\('
