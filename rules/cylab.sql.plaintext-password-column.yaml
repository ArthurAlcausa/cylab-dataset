rules:
  - id: cylab.sql.plaintext-password-column
    message: "A tabela de @T@ guarda a senha em coluna de texto, induzindo armazenamento em claro (CWE-256)"
    severity: ERROR
    languages: [generic]
    metadata:
      cwe: "CWE-256"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(?i)\b(senha|password|pwd|passwd)\w*\s+(VARCHAR|NVARCHAR|TEXT|CHAR|VARCHAR2)\b'
