rules:
  - id: cylab.cpp.rand-token
    message: "O token de @S@ é gerado com rand(), um PRNG previsível e de baixa entropia (CWE-338)"
    severity: ERROR
    languages: [cpp]
    metadata:
      cwe: "CWE-338"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '\b(std::)?rand\s*\(\s*\)'
