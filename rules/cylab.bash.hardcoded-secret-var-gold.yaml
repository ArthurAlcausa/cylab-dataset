rules:
- id: cylab.bash.hardcoded-secret-var-gold
  languages:
  - bash
  severity: ERROR
  message: A credencial do serviço de @T@ está escrita no script e fica exposta no
    repositório e em ps (CWE-798)
  metadata:
    cwe: CWE-798
    source: sintetico-cylab
    author: bill-scale
  pattern-regex: (?im)^\s*(export\s+)?\w*(PASSWORD|PASSWD|SENHA|TOKEN|SECRET|API_KEY)\w*=["\']?[A-Za-z0-9_#!@%.\-]{6,}
