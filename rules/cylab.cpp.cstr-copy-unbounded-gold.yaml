rules:
- id: cylab.cpp.cstr-copy-unbounded-gold
  languages:
  - cpp
  severity: ERROR
  message: Copiar o @C@ de @S@ para um array fixo com strcpy/sprintf não limita o
    tamanho e pode estourar a pilha (CWE-120)
  metadata:
    cwe: CWE-120
    source: sintetico-cylab
    author: bill-scale
  pattern-either:
  - pattern: strcpy($D, $S)
  - pattern: strcat($D, $S)
  - pattern: sprintf(...)
  - pattern: std::strcpy($D, $S)
  - pattern: std::strcat($D, $S)
  - pattern: std::sprintf(...)
