    - pattern-not-inside: "if <... $V.startswith(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... os.path.commonpath(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.is_relative_to(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V not in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.fullmatch(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.match(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isdigit() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isalnum() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.hostname ...>:\n  ...\n..."
