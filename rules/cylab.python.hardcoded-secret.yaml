rules:
  - id: cylab.python.hardcoded-secret
    message: "Credencial embutida no codigo-fonte (CWE-798)"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-798"
      source: sintetico-cylab
    patterns:
      - pattern-either:
          - pattern: $K = "..."
      - metavariable-regex:
          metavariable: $K
          regex: (?i).*(api_key|secret|password|senha|token).*
