rules:
  - id: cylab.csharp.html-content-interp
    message: "O controller de @T@ monta HTML interpolando valor do usuário e o devolve como conteúdo bruto, causando XSS (CWE-79)"
    severity: ERROR
    languages: [csharp]
    metadata:
      cwe: "CWE-79"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'Content\(\s*\$"|new\s+HtmlString\(\s*\$"|Html\.Raw\('
