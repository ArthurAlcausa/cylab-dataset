rules:
  - id: cylab.c.world-writable-mode
    message: "O arquivo/diretório de @T@ é criado com permissão 0666/0777, gravável por qualquer usuário local (CWE-732)"
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-732"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '\b(chmod|open|creat|mkdir)\s*\([^;]*\b0?(777|666)\s*\)'
