rules:
- id: cylab.python.sql-injection
  mode: taint
  message: 'SQL montado com formatacao de string (CWE-89) [gold: taint]'
  severity: ERROR
  languages:
  - python
  metadata:
    cwe: CWE-89
    source: sintetico-cylab
    gold: taint-v1-sam
  pattern-sources:
  - patterns:
    - pattern: "def $F(..., $P, ...):\n  ..."
    - focus-metavariable: $P
    - metavariable-regex:
        metavariable: $P
        regex: ^(?!(self|cls|conn|db|cur|cursor|session)$)
  - pattern: request.$A
  - pattern: request.$A[...]
  - pattern: request.$A.get(...)
  - pattern: request.$A(...)
  pattern-sinks:
  - patterns:
    - pattern: $C.execute($X, ...)
    - focus-metavariable: $X
    - pattern-not-inside: "if <... $V.startswith(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... os.path.commonpath(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.is_relative_to(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V not in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.fullmatch(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.match(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isdigit() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isalnum() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.hostname ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.netloc ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.scheme ...>:\n  ...\n..."
  - patterns:
    - pattern: $C.executemany($X, ...)
    - focus-metavariable: $X
    - pattern-not-inside: "if <... $V.startswith(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... os.path.commonpath(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.is_relative_to(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V not in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.fullmatch(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.match(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isdigit() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isalnum() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.hostname ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.netloc ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.scheme ...>:\n  ...\n..."
  - patterns:
    - pattern: $C.raw($X, ...)
    - focus-metavariable: $X
    - pattern-not-inside: "if <... $V.startswith(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... os.path.commonpath(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.is_relative_to(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V not in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.fullmatch(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.match(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isdigit() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isalnum() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.hostname ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.netloc ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.scheme ...>:\n  ...\n..."
  - patterns:
    - pattern: text($X)
    - focus-metavariable: $X
    - pattern-not-inside: "if <... $V.startswith(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... os.path.commonpath(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.is_relative_to(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V not in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.fullmatch(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.match(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isdigit() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isalnum() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.hostname ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.netloc ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.scheme ...>:\n  ...\n..."
  - patterns:
    - pattern: $C.executescript($X)
    - focus-metavariable: $X
    - pattern-not-inside: "if <... $V.startswith(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... os.path.commonpath(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.is_relative_to(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V not in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.fullmatch(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.match(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isdigit() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isalnum() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.hostname ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.netloc ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.scheme ...>:\n  ...\n..."
  pattern-sanitizers:
  - pattern: urllib.parse.quote(...)
  - pattern: quote(...)
  - pattern: urlencode(...)
  - pattern: os.path.basename(...)
  - pattern: $X if $X in $S else $D
  - pattern: int(...)
  - pattern: float(...)
  - pattern: shlex.quote(...)
  - pattern: os.path.basename(...)
  - pattern: secure_filename(...)
  - pattern: html.escape(...)
  - pattern: escape(...)
  - pattern: markupsafe.escape(...)
  - pattern: bool(...)
  - pattern: len(...)
