rules:
- id: cylab.bash.secret-echo-to-file-gold
  languages:
  - bash
  severity: ERROR
  message: O segredo de @T@ é gravado com echo em arquivo criado com umask padrão
    (legível por outros) (CWE-312)
  metadata:
    cwe: CWE-312
    source: sintetico-cylab
    author: bill-scale
  pattern-regex: (?m)^(?!\s*#)[^#\n]*?\becho\s+"?[\w=]*\$\{?\w*(TOKEN|SENHA|PASSWORD|SECRET|KEY)\w*\}?"?\s*>>?\s*\S+
