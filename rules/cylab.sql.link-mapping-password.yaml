rules:
  - id: cylab.sql.link-mapping-password
    message: "O database link / user mapping usado por @T@ grava a senha remota em claro no DDL versionado (CWE-798)"
    severity: ERROR
    languages: [generic]
    metadata:
      cwe: "CWE-798"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(?i)CONNECT\s+TO\s+\w+\s+IDENTIFIED\s+BY|OPTIONS\s*\([^)]*\bpassword\s+'''
