rules:
  - id: cylab.java.xxe-documentbuilder
    message: "O XML de @T@ é processado com DocumentBuilderFactory padrão, que resolve DTD e entidades externas (XXE, CWE-611), permit (CWE-611)"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-611"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'DocumentBuilderFactory\.newInstance\(\)\s*;(?![\s\S]*disallow-doctype-decl)'
