rules:
- id: cylab.c.strcpy-strcat-gold
  languages:
  - c
  severity: ERROR
  message: strcpy/strcat copiam o @C@ de @S@ sem checar o tamanho do buffer de destino,
    causando estouro de buffer (CWE-120)
  metadata:
    cwe: CWE-120
    source: sintetico-cylab
    author: bill-scale
  pattern-either:
  - pattern: strcpy($D, $S)
  - pattern: strcat($D, $S)
