rules:
- id: cylab.bash.chmod-world-writable-gold
  languages:
  - bash
  severity: ERROR
  message: Dar permissão de escrita para todos nos arquivos de @T@ permite que qualquer
    usuário local altere ou substitua dados/scr (CWE-732)
  metadata:
    cwe: CWE-732
    source: sintetico-cylab
    author: bill-scale
  pattern-regex: (?m)^(?!\s*#)[^#\n]*?\bchmod\s+(-R\s+)?(0?777|0?666|a\+w|o\+w)\b
