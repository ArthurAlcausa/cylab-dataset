rules:
  - id: cylab.php.eval-user-code
    message: "A expressão de cálculo/ordenação de @S@ vinda do usuário é executada com eval/create_function, permitindo execução de có (CWE-95)"
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-95"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '\b(eval|assert|create_function)\s*\('
