rules:
  - id: cylab.bash.secret-echo-to-file
    message: "O segredo de @T@ é gravado com echo em arquivo criado com umask padrão (legível por outros) (CWE-312)"
    severity: ERROR
    languages: [bash]
    metadata:
      cwe: "CWE-312"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'echo\s+"?[\w=]*\$\{?\w*(TOKEN|SENHA|PASSWORD|SECRET|KEY)\w*\}?"?\s*>>?\s*\S+'
