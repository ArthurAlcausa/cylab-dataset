  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: function $F(..., $P, ...) {...}
      - pattern: ($P) => {...}
      - pattern: ($P) => $E
      - pattern: (..., $P, ...) => {...}
      - pattern: (..., $P, ...) => $E
      - pattern: $M(..., $P, ...) {...}
      - pattern: function $F(..., {..., $P, ...}, ...) {...}
      - pattern: ({..., $P, ...}) => {...}
      - pattern: ({..., $P, ...}) => $E
      - pattern: 'function $F(..., {..., $P, ...}: $T, ...) {...}'
      - pattern: '({..., $P, ...}: $T) => {...}'
      - pattern: '({..., $P, ...}: $T) => $E'
    - focus-metavariable: $P
    - metavariable-regex:
        metavariable: $P
        regex: ^(?!(res|resp|response|next|cb|callback|db|pool|conn|ds|knex|client|s|sanitizer)$)
