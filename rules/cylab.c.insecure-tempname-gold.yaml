rules:
- id: cylab.c.insecure-tempname-gold
  languages:
  - c
  severity: ERROR
  message: O arquivo temporário de @T@ usa tmpnam/mktemp, cujo nome previsível permite
    corrida e ataque de symlink (CWE-377)
  metadata:
    cwe: CWE-377
    source: sintetico-cylab
    author: bill-scale
  pattern-either:
  - pattern: tmpnam(...)
  - pattern: tempnam(...)
  - pattern: mktemp(...)
