rules:
  - id: cylab.php.echo-superglobal
    message: "O parâmetro @C@ da requisição é ecoado no HTML sem escape, gerando XSS refletido (CWE-79)"
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-79"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(echo|print)\s+(\$_(GET|POST|REQUEST|COOKIE)\[|["''][^"'']*["'']\s*\.\s*\$_(GET|POST|REQUEST|COOKIE)\[)'
