rules:
  - id: cylab.php.xss-echo
    message: "echo de superglobal sem escape (CWE-79)"
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-79"
      source: sintetico-cylab
    pattern-either:
      - pattern: echo $_GET[$K];
      - pattern: echo "..." . $_GET[$K] . "...";
      - pattern: echo "..." . $_GET[$K];
