rules:
  - id: cylab.typescript.hardcoded-credential
    message: "Uma credencial do serviço de @T@ está fixa no código-fonte e vaza via repositório ou bundle (CWE-798)"
    severity: ERROR
    languages: [typescript]
    metadata:
      cwe: "CWE-798"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(SECRET|API_KEY|TOKEN|PASSWORD|SENHA)\w*\s*(:\s*string\s*)?=\s*[''"][^''"]{8,}[''"]'
