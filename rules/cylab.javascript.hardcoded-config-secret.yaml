rules:
  - id: cylab.javascript.hardcoded-config-secret
    message: "A configuração do cliente de @T@ embute credencial literal no código, exposta no repositório (CWE-798)"
    severity: ERROR
    languages: [javascript]
    metadata:
      cwe: "CWE-798"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '(password|secret|secretAccessKey|accessKeyId|apiKey|clientSecret)\s*:\s*[''"][^''"]{8,}[''"]'
