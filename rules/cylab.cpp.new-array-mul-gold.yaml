rules:
- id: cylab.cpp.new-array-mul-gold
  languages:
  - cpp
  severity: ERROR
  message: O buffer de @T@ é alocado com new[] usando produto de dimensões externas
    sem checar overflow; o valor pode estourar e al (CWE-190)
  metadata:
    cwe: CWE-190
    source: sintetico-cylab
    author: bill-scale
  pattern-either:
  - pattern: new $T[$A * $B]
