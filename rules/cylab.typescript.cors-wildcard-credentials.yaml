rules:
  - id: cylab.typescript.cors-wildcard-credentials
    message: "A API de @T@ aceita qualquer origem com credenciais, permitindo que sites maliciosos leiam respostas autenticadas (CWE-942)"
    severity: ERROR
    languages: [typescript]
    metadata:
      cwe: "CWE-942"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'origin:\s*[''"]\*[''"]|origin:\s*true'
