rules:
  - id: cylab.bash.password-on-cmdline
    message: "A senha do banco/host de @T@ é passada na linha de comando, visível em ps e no histórico (CWE-214)"
    severity: ERROR
    languages: [bash]
    metadata:
      cwe: "CWE-214"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: '\b(mysql|mysqldump|mysqladmin)\b[^\n]*\s-p\S+|sshpass\s+-p\s*\S+'
