rules:
- id: cylab.cpp.std-system-gold
  languages:
  - cpp
  severity: ERROR
  message: A string de comando inclui @C@ externo e é executada por std::system, que
    passa pelo shell e permite injeção (CWE-78)
  metadata:
    cwe: CWE-78
    source: sintetico-cylab
    author: bill-scale
  pattern-either:
  - pattern: system($C)
  - pattern: std::system($C)
  - pattern: popen($C, $M)
