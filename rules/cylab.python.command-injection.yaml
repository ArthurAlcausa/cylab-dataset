rules:
- id: cylab.python.command-injection
  mode: taint
  message: 'Comando de shell com entrada externa (CWE-78) [gold: taint]'
  severity: ERROR
  languages:
  - python
  metadata:
    cwe: CWE-78
    source: sintetico-cylab
    gold: taint-v1-sam
  pattern-sources:
  - patterns:
    - pattern: "def $F(..., $P, ...):\n  ..."
    - focus-metavariable: $P
    - metavariable-regex:
        metavariable: $P
        regex: ^(?!(self|cls|conn|db|cur|cursor|session)$)
  - pattern: request.$A
  - pattern: request.$A[...]
  - pattern: request.$A.get(...)
  - pattern: request.$A(...)
  pattern-sinks:
  - patterns:
    - pattern: os.system($X)
    - focus-metavariable: $X
    - pattern-not-inside: "if <... $V.startswith(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... os.path.commonpath(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.is_relative_to(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V not in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.fullmatch(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.match(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isdigit() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isalnum() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.hostname ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.netloc ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.scheme ...>:\n  ...\n..."
  - patterns:
    - pattern: os.popen($X, ...)
    - focus-metavariable: $X
    - pattern-not-inside: "if <... $V.startswith(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... os.path.commonpath(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.is_relative_to(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V not in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.fullmatch(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.match(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isdigit() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isalnum() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.hostname ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.netloc ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.scheme ...>:\n  ...\n..."
  - patterns:
    - pattern: subprocess.$F($X, ..., shell=True, ...)
    - focus-metavariable: $X
    - pattern-not-inside: "if <... $V.startswith(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... os.path.commonpath(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.is_relative_to(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V not in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.fullmatch(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.match(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isdigit() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isalnum() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.hostname ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.netloc ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.scheme ...>:\n  ...\n..."
  - patterns:
    - pattern: commands.getoutput($X)
    - focus-metavariable: $X
    - pattern-not-inside: "if <... $V.startswith(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... os.path.commonpath(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.is_relative_to(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V not in $S ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.fullmatch(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... re.match(...) ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isdigit() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.isalnum() ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.hostname ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.netloc ...>:\n  ...\n..."
    - pattern-not-inside: "if <... $V.scheme ...>:\n  ...\n..."
  pattern-sanitizers:
  - pattern: urllib.parse.quote(...)
  - pattern: quote(...)
  - pattern: urlencode(...)
  - pattern: os.path.basename(...)
  - pattern: $X if $X in $S else $D
  - pattern: int(...)
  - pattern: float(...)
  - pattern: shlex.quote(...)
  - pattern: os.path.basename(...)
  - pattern: secure_filename(...)
  - pattern: html.escape(...)
  - pattern: escape(...)
  - pattern: markupsafe.escape(...)
  - pattern: bool(...)
  - pattern: len(...)
