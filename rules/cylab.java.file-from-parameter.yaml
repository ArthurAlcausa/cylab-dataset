rules:
  - id: cylab.java.file-from-parameter
    message: "O servlet de @T@ abre arquivo com nome vindo direto do parâmetro HTTP, permitindo ../ (CWE-22)"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-22"
      source: sintetico-cylab
      author: bill-scale
    pattern-regex: 'new\s+(File|FileInputStream|FileReader)\(\s*[^;]*request\.getParameter'
