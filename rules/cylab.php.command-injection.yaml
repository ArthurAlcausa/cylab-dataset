rules:
  - id: cylab.php.command-injection
    message: "shell_exec/system com entrada externa (CWE-78)"
    severity: ERROR
    languages: [php]
    metadata:
      cwe: "CWE-78"
      source: sintetico-cylab
    pattern-either:
      - pattern: shell_exec("..." . $_GET[$K])
      - pattern: system("..." . $_GET[$K])
