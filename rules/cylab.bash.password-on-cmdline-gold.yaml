rules:
- id: cylab.bash.password-on-cmdline-gold
  languages:
  - bash
  severity: ERROR
  message: A senha do banco/host de @T@ é passada na linha de comando, visível em
    ps e no histórico (CWE-214)
  metadata:
    cwe: CWE-214
    source: sintetico-cylab
    author: bill-scale
  pattern-regex: (?m)^(?!\s*#)[^#\n]*?(\b(mysql|mysqldump|mysqladmin)\b[^\n#]*\s-p\S+|\bsshpass\s+-p\s*\S+)
